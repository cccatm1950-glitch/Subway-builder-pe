name: Android debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: Export Android debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Create temporary Android debug signing key
        run: |
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/android-debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$RUNNER_TEMP/android-debug.keystore" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> "$GITHUB_ENV"

      - name: Diagnose Android export environment
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            barichello/godot-ci:4.4.1 \
            bash -lc '
              echo "=== Tool versions ==="
              godot --version
              java -version
              echo "=== Android environment ==="
              env | sort | grep -E "^(ANDROID|JAVA|GODOT)" || true
              echo "=== Android SDK directories ==="
              for d in "$ANDROID_HOME" "$ANDROID_SDK_ROOT" /opt/android-sdk /root/Android/Sdk /usr/lib/android-sdk; do
                if [ -n "$d" ] && [ -d "$d" ]; then
                  echo "--- $d"
                  ls -la "$d" | head -40
                  [ ! -d "$d/platforms" ] || ls -la "$d/platforms"
                  [ ! -d "$d/build-tools" ] || ls -la "$d/build-tools"
                fi
              done
              echo "=== Godot export templates ==="
              ls -la /root/.local/share/godot/export_templates/ 2>&1 || true
              echo "=== Godot config ==="
              ls -la /root/.config/godot/ 2>&1 || true
              echo "=== Editor settings contents ==="
              cat /root/.config/godot/editor_settings-4.4.tres 2>&1 || true
              echo "=== Android SDK package inventory ==="
              /usr/lib/android-sdk/cmdline-tools/latest/bin/sdkmanager --list 2>&1 | head -100 || true
              echo "=== Export template files ==="
              find /root/.local/share/godot/export_templates/4.4.1.stable -maxdepth 2 -type f -printf "%p %s bytes\\n" 2>&1 | head -80
            '

      - name: Install Godot 4.4 Android SDK components
        run: |
          docker run --rm \
            -w /workspace \
            barichello/godot-ci:4.4.1 \
            bash -lc '
              set -e
              SDKMANAGER=/usr/lib/android-sdk/cmdline-tools/latest/bin/sdkmanager
              yes | "$SDKMANAGER" --sdk_root=/usr/lib/android-sdk --licenses
              "$SDKMANAGER" --sdk_root=/usr/lib/android-sdk \
                "platform-tools" \
                "build-tools;34.0.0" \
                "platforms;android-34" \
                "cmdline-tools;latest" \
                "cmake;3.10.2.4988404" \
                "ndk;23.2.8568313"
            '

      - name: Run isolated Android export smoke test
        run: bash -x ci/android-export-smoke.sh

      - name: Import project and export APK with verbose diagnostics
        run: |
          mkdir -p build/android
          docker run --rm \
            -e GODOT_ANDROID_KEYSTORE_DEBUG_PATH=/root/debug.keystore \
            -e GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey \
            -e GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android \
            -v "${{ github.workspace }}:/workspace" \
            -v "$RUNNER_TEMP/android-debug.keystore:/root/debug.keystore:ro" \
            -w /workspace \
            barichello/godot-ci:4.4.1 \
            bash -lc 'set -o pipefail; echo "=== Signing environment ==="; env | grep "^GODOT_ANDROID_KEYSTORE_DEBUG_" | sed "s/PASSWORD=.*/PASSWORD=[set]/"; keytool -list -keystore /root/debug.keystore -storepass android -alias androiddebugkey; test -r /root/debug.keystore; godot --headless --path . --editor --quit --verbose 2>&1 | tee /tmp/godot-import.log; godot --headless --path . --export-debug "Android" build/android/SubwayBuilderMobileUnofficial-debug.apk --verbose 2>&1 | tee /tmp/godot-export.log'

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Subway-Builder-Mobile-Unofficial-debug
          path: build/android/SubwayBuilderMobileUnofficial-debug.apk
          if-no-files-found: error
          retention-days: 14
